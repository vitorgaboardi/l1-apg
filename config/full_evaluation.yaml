# Boolean flags to enable/disable each evaluation type
enable_evaluations:
  agent: true              # Run agent API-calling evaluation
  diversity: true          # Run linguistic diversity evaluation
  patterns: true           # Run linguistic patterns (stylometric) evaluation

# Agent Evaluation Configuration
# List of (agent_model, generation_method) pairs to evaluate
# The agent model will be tested on generated datasets using each generation method
agent_eval_pairs:
  - ["mistralai/Ministral-3-8B-Instruct-2512", "l1-apg"]
  - ["mistralai/Ministral-3-8B-Instruct-2512", "toolalpaca"]
  - ["mistralai/Ministral-3-8B-Instruct-2512", "toolalpaca_persona"]
  - ["Qwen/Qwen3.5-9B", "l1-apg"]
  - ["Qwen/Qwen3.5-9B", "toolalpaca"]
  - ["Qwen/Qwen3.5-9B", "toolalpaca_persona"]
  - ["meta-llama/Llama-3.1-8B-Instruct", "l1-apg"]
  - ["meta-llama/Llama-3.1-8B-Instruct", "toolalpaca"]
  - ["meta-llama/Llama-3.1-8B-Instruct", "toolalpaca_persona"]    

# Linguistic Diversity Configuration
# List of (generation_method, llm_used_for_data_generation) pairs
# Tests linguistic diversity of utterances generated by each data model
# using the specified generation method
diversity_eval_pairs:
  - ["l1-apg", "gpt-5.4"]
  - ["toolalpaca_persona", "gpt-5.4"]
  - ["toolalpaca", "gpt-5.4"]  

# Linguistic Patterns Configuration (L1-APG only)
# List of llm_used_for_data_generation models to test
# NOTE: Only works with generation_method="l1-apg"
patterns_eval_models:
  - "gpt-5.4"
  - "gpt-4o-mini"
  - "claude-4-sonnet"
  - "DeepSeek-V4-Pro"
  - "Llama-4-Maverick-17B-128E-Instruct-Turbo"
